# Preview per pull request, production on main.
# Needs an IAM role GitHub can assume through OIDC, stored as the AWS_DEPLOY_ROLE_ARN secret.
name: hatch

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: hatch-${{ github.event.pull_request.number || 'prod' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm ci

      - name: Deploy preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        id: preview
        run: |
          npx hatch deploy --stage pr-${{ github.event.pull_request.number }} | tee deploy.log
          echo "url=$(grep -o 'https://[^ ]*' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.preview.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview: ${{ steps.preview.outputs.url }}`;
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = data.find((c) => c.body?.startsWith("Preview: "));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Destroy preview
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: npx hatch destroy --stage pr-${{ github.event.pull_request.number }} --yes --purge-data

      - name: Deploy production
        if: github.event_name == 'push'
        run: npx hatch deploy --stage prod
