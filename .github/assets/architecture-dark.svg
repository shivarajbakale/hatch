<rect x="16" y="110" width="220" height="200" rx="14" fill="#18181B" stroke="#3F3F46"/>
<text class="t" x="36" y="142" font-size="15" font-weight="600">Your app</text>
<text class="m" x="36" y="174">import { serve, kv, secret }</text>
<text class="m" x="36" y="193">  from "hatch"</text>
<text class="m" x="36" y="231">const db = kv("sessions")</text>
<text class="m" x="36" y="250">const key = secret("API_KEY")</text>
<text class="m" x="36" y="288">serve(app)</text>
